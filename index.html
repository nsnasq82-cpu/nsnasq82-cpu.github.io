<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>قيد بنت السبيت</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px 10px 28px;
 background:linear-gradient(180deg,#f8f8f8 0%,#eef0f3 100%);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
 color:#202124;overflow-x:hidden;
}
.wrap{max-width:600px;margin:auto}
h1{
 text-align:center;font-size:23px;font-weight:800;
 margin:3px 0 16px;letter-spacing:.2px;
}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.player{
 background:rgba(255,255,255,.96);
 border:1px solid #e9eaed;border-radius:16px;
 padding:9px 5px 11px;
 box-shadow:0 4px 14px rgba(0,0,0,.06);
 text-align:center;min-width:0;
}
.name{
 width:100%;border:0;background:transparent;
 text-align:center;font-size:20px;font-weight:750;
 padding:1px 0 6px;outline:0;color:#202124;
}
.total{
 font-size:29px;font-weight:850;line-height:1.05;
 margin-bottom:9px;min-height:31px;
}
.total.high{color:#d43b3b}
.total.low{color:#19945a}
.total.mid{color:#2875b9}
input[type=number]{
 width:100%;height:41px;border:1px solid #dfe1e5;
 border-radius:10px;text-align:center;font-size:16px;
 background:#fafafa;outline:0;
}
input[type=number]:focus{border-color:#aaa;background:#fff}
.neg{
 margin-top:6px;width:100%;height:36px;border:0;
 border-radius:10px;background:#eceef1;color:#252525;
 font-size:23px;font-weight:800;line-height:1;
}
.mainbtn,.reset{
 width:100%;height:48px;border:0;border-radius:13px;
 margin-top:13px;font-size:17px;font-weight:750;
}
.mainbtn{
 background:#222;color:#fff;
 box-shadow:0 4px 12px rgba(0,0,0,.13);
}
.reset{background:#e7e8eb;color:#333;margin-top:8px}
.history{
 margin-top:20px;background:rgba(255,255,255,.97);
 border:1px solid #e9eaed;border-radius:16px;
 padding:13px 7px 15px;
 box-shadow:0 4px 14px rgba(0,0,0,.06);
}
.history h2{text-align:center;font-size:19px;margin:0 0 13px;font-weight:800}
.hist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.hist-name{font-weight:750;font-size:16px;margin-bottom:6px}
.hist-num{font-size:18px;padding:5px 0;cursor:pointer;border-radius:7px}
.hist-num:active{background:#f0f1f3}
.final{font-size:22px;font-weight:850;margin-top:8px}
.high{color:#d43b3b}.low{color:#19945a}.mid{color:#2875b9}
.note{text-align:center;color:#888;font-size:11px;margin-top:9px}
@media(max-width:360px){
 .name{font-size:18px}.total{font-size:26px}
 .hist-name{font-size:15px}.hist-num{font-size:17px}
}
</style>
</head>
<body><div class="wrap">
<h1>🎴 قيد بنت السبيت</h1>
<div class="players">
<div class="player"><input class="name" id="name0" value="لاعب 1"><div class="total" id="total0">0</div><input type="number" id="v0" inputmode="numeric" placeholder="الرقم"><button class="neg" onclick="neg(0)">−</button></div>
<div class="player"><input class="name" id="name1" value="لاعب 2"><div class="total" id="total1">0</div><input type="number" id="v1" inputmode="numeric" placeholder="الرقم"><button class="neg" onclick="neg(1)">−</button></div>
<div class="player"><input class="name" id="name2" value="لاعب 3"><div class="total" id="total2">0</div><input type="number" id="v2" inputmode="numeric" placeholder="الرقم"><button class="neg" onclick="neg(2)">−</button></div>
<div class="player"><input class="name" id="name3" value="لاعب 4"><div class="total" id="total3">0</div><input type="number" id="v3" inputmode="numeric" placeholder="الرقم"><button class="neg" onclick="neg(3)">−</button></div>
</div>
<button class="mainbtn" id="addBtn">إضافة الجولة</button><button class="reset" onclick="resetGame()">لعبة جديدة</button>
<div class="history"><h2>سجل الأكلات</h2><div class="hist-grid" id="historyGrid"></div><div class="note">اضغط على أي رقم في السجل لتعديله</div></div>
</div>
<script>
let scores=[[],[],[],[]];
function neg(i){let e=document.getElementById("v"+i);if(e.value==="")return;let n=Number(e.value);if(n>0)e.value=-n}
function addRound(){let v=[0,1,2,3].map(i=>{let x=document.getElementById("v"+i).value.trim();return x===""?0:Number(x)});if(v.every(x=>x===0)){alert("أدخل رقم واحد على الأقل");return}v.forEach((x,i)=>scores[i].push(x));[0,1,2,3].forEach(i=>document.getElementById("v"+i).value="");draw()}
function edit(i,j){let v=prompt("عدّل الرقم:",scores[i][j]);if(v!==null&&!isNaN(Number(v))&&v.trim()!==""){scores[i][j]=Number(v);draw()}}
function draw(){let t=scores.map(a=>a.reduce((x,y)=>x+y,0)),hi=Math.max(...t),lo=Math.min(...t),g=document.getElementById("historyGrid");t.forEach((x,i)=>{let e=document.getElementById("total"+i);e.textContent=x;e.className="total "+(x===hi?"high":x===lo?"low":"mid")});g.innerHTML="";for(let i=0;i<4;i++){let c=document.createElement("div"),n=document.createElement("div");n.className="hist-name";n.textContent=document.getElementById("name"+i).value||("لاعب "+(i+1));c.appendChild(n);scores[i].forEach((x,j)=>{let d=document.createElement("div");d.className="hist-num";d.textContent=x;d.onclick=()=>edit(i,j);c.appendChild(d)});let f=document.createElement("div");f.className="final "+(t[i]===hi?"high":t[i]===lo?"low":"mid");f.textContent=t[i];c.appendChild(f);g.appendChild(c)}}
function resetGame(){if(confirm("هل تريد بدء لعبة جديدة؟")){scores=[[],[],[],[]];draw()}}
[0,1,2,3].forEach(i=>document.getElementById("name"+i).addEventListener("input",draw));document.getElementById("addBtn").addEventListener("click",addRound);draw();
</script></body></html>
