<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بنت السبيت - دفتر القيد</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-width:0;max-width:100vw;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f4f6;color:#111;padding-bottom:env(safe-area-inset-bottom)}
.wrap{width:100%;max-width:430px;margin:0 auto;padding:6px}
.card{background:#fff;border:1px solid #e1e3e6;border-radius:15px;padding:8px;box-shadow:0 5px 18px rgba(0,0,0,.07)}
header{text-align:center}
h1{font-size:23px;margin:2px 0 1px;font-weight:900}
.sub{font-size:11px;color:#777;margin:0 0 9px}

.players{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.player{min-width:0;border:1px solid #e1e3e6;border-radius:10px;background:#fafafa;padding:6px 3px;text-align:center}
.name{width:100%;min-width:0;border:0;background:transparent;outline:0;text-align:center;font-size:13px;font-weight:900;padding:2px 0}
.player:nth-child(1) .name{color:#1565c0}
.player:nth-child(2) .name{color:#2e7d32}
.player:nth-child(3) .name{color:#8e24aa}
.player:nth-child(4) .name{color:#c62828}
.total{font-size:38px;font-weight:950;line-height:1;margin:2px 0 9px;font-variant-numeric:tabular-nums}

.entry{display:grid;grid-template-columns:1fr 40px;gap:3px}
.entry input{width:100%;height:42px;min-width:0;border:1px solid #d6d9de;border-radius:11px;background:#fff;text-align:center;font-size:16px;font-weight:800;padding:0 2px;outline:0;-webkit-appearance:none}
.minus{width:40px;height:42px;border:0;border-radius:11px;background:#fdeaea;color:#b52d2d;font-size:28px;font-weight:950;line-height:1;touch-action:manipulation}

.mainbtn,.clearbtn{width:100%;height:48px;border:0;border-radius:12px;font-size:15px;font-weight:900;margin-top:8px;touch-action:manipulation}
.mainbtn{background:#20242a;color:#fff}
.clearbtn{background:#eee;color:#333}

.history{margin-top:10px;border-top:1px solid #eee;padding-top:7px}
.history h2{text-align:center;font-size:17px;margin:0 0 6px}
.history-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.hcol{min-width:0;text-align:center;border-left:1px solid #eee;padding:0 2px}
.hcol:last-child{border-left:0}
.hname{font-size:13px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcol:nth-child(1) .hname{color:#1565c0}
.hcol:nth-child(2) .hname{color:#2e7d32}
.hcol:nth-child(3) .hname{color:#8e24aa}
.hcol:nth-child(4) .hname{color:#c62828}
.nums{display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:2px}
.num{border:0;background:transparent;padding:0;min-height:28px;font:inherit;font-size:20px;font-weight:950;color:#090b0e;line-height:1.15}
.htotal{margin-top:4px;padding-top:3px;border-top:1px solid #eee;font-size:13px;font-weight:950}
.high{color:#d60000}.low{color:#168a32}.mid{color:#1565c0}
.hint{text-align:center;font-size:9px;color:#999;margin-top:5px}

@media(max-width:360px){
 .wrap{padding:4px}.card{padding:5px}.players,.history-grid{gap:2px}
 .player{padding:5px 2px}.name{font-size:11px}.total{font-size:33px}
 .entry{grid-template-columns:1fr 38px}.entry input{height:39px;font-size:15px}.minus{width:38px;height:39px}
}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<header><h1>🎴 بنت السبيت</h1><p class="sub">دفتر القيد — 4 لاعبين</p></header>

<form id="scoreForm">\n<div class="players">
  <div class="player"><input class="name" id="name0" value="لاعب 1"><div class="total" id="total0">0</div><div class="entry"><input id="v0" type="number" inputmode="numeric" placeholder="رقم الأكلة"><button type="button" class="minus" onclick="neg(0)">−</button></div></div>
  <div class="player"><input class="name" id="name1" value="لاعب 2"><div class="total" id="total1">0</div><div class="entry"><input id="v1" type="number" inputmode="numeric" placeholder="رقم الأكلة"><button type="button" class="minus" onclick="neg(1)">−</button></div></div>
  <div class="player"><input class="name" id="name2" value="لاعب 3"><div class="total" id="total2">0</div><div class="entry"><input id="v2" type="number" inputmode="numeric" placeholder="رقم الأكلة"><button type="button" class="minus" onclick="neg(2)">−</button></div></div>
  <div class="player"><input class="name" id="name3" value="لاعب 4"><div class="total" id="total3">0</div><div class="entry"><input id="v3" type="number" inputmode="numeric" placeholder="رقم الأكلة"><button type="button" class="minus" onclick="neg(3)">−</button></div></div>
</div>

<button type="submit" class="mainbtn" id="addBtn">إضافة الجولة</button>\n</form>

<div class="history">
<h2>سجل الأكلات</h2>
<div class="history-grid">
  <div class="hcol"><div class="hname" id="hn0">لاعب 1</div><div class="nums" id="nums0"></div><div class="htotal" id="ht0">0</div></div>
  <div class="hcol"><div class="hname" id="hn1">لاعب 2</div><div class="nums" id="nums1"></div><div class="htotal" id="ht1">0</div></div>
  <div class="hcol"><div class="hname" id="hn2">لاعب 3</div><div class="nums" id="nums2"></div><div class="htotal" id="ht2">0</div></div>
  <div class="hcol"><div class="hname" id="hn3">لاعب 4</div><div class="nums" id="nums3"></div><div class="htotal" id="ht3">0</div></div>
</div>
<div class="hint">اضغط على الرقم في السجل لتعديله</div>
</div>

<button class="clearbtn" onclick="resetGame()">تصفير اللعبة وبدء لعبة جديدة</button>
</div></div>

<script>
var scores=[[0],[0],[0],[0]];
/* نحذف القيم الوهمية من البداية */
scores=[[],[],[],[]];

function neg(i){
  var x=document.getElementById("v"+i);
  var n=Math.abs(Number(x.value));
  if(n){x.value=-n}
}

function addRound(){
  var vals=[], i, any=false;
  for(i=0;i<4;i++){
    var n=Number(document.getElementById("v"+i).value)||0;
    vals.push(n);
    if(n!==0) any=true;
  }
  if(!any){alert("اكتب رقم واحد على الأقل");return}
  for(i=0;i<4;i++){scores[i].push(vals[i]);document.getElementById("v"+i).value=""}
  draw();
}

function edit(i,j){
  var a=prompt("عدّل الرقم:",String(scores[i][j]));
  if(a===null)return;
  var n=Number(a);
  if(!isFinite(n)){alert("اكتب رقمًا صحيحًا.");return}
  scores[i][j]=n;
  draw();
}

function draw(){
  var totals=[],i,j,t,box,b;
  for(i=0;i<4;i++){
    t=0;
    for(j=0;j<scores[i].length;j++)t+=scores[i][j];
    totals.push(t);
    document.getElementById("total"+i).textContent=t;
    document.getElementById("hn"+i).textContent=document.getElementById("name"+i).value;
    document.getElementById("ht"+i).textContent=t;
    box=document.getElementById("nums"+i);
    box.innerHTML="";
    for(j=0;j<scores[i].length;j++){
      b=document.createElement("button");
      b.className="num";
      b.textContent=scores[i][j];
      (function(ii,jj){b.onclick=function(){edit(ii,jj)}})(i,j);
      box.appendChild(b);
    }
  }
  var max=Math.max.apply(null,totals),min=Math.min.apply(null,totals);
  for(i=0;i<4;i++){
    var el=document.getElementById("ht"+i);
    el.className="htotal";
    if(max!==min && totals[i]===max)el.className+=" high";
    else if(max!==min && totals[i]===min)el.className+=" low";
    else el.className+=" mid";
  }
}
for(var k=0;k<4;k++){
  document.getElementById("name"+k).oninput=(function(i){return function(){
    document.getElementById("hn"+i).textContent=this.value;
  }})(k);
}
function resetGame(){
  if(confirm("متأكد تبي تمسح كل الأكلات وتبدأ لعبة جديدة؟")){
    scores=[[],[],[],[]];
    draw();
  }
}
/* ربط زر إضافة الجولة بطريقة مباشرة ومتوافقة مع Safari/iPhone */
document.getElementById("addBtn").addEventListener("click", function(e){
  e.preventDefault();
  addRound();
});

/* حفظ الأسماء أثناء الكتابة */
for(var z=0;z<4;z++){
  document.getElementById("name"+z).addEventListener("input", function(){
    var idx=Number(this.id.replace("name",""));
    document.getElementById("hn"+idx).textContent=this.value;
  });
}

draw();
</script>

<script>
(function () {
  function initIOSScoreUI() {
    var btn = document.getElementById('addBtn');
    var form = document.getElementById('scoreForm');

    if (form) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (typeof addRound === 'function') addRound();
      });
    }

    if (btn) {
      btn.addEventListener('touchend', function (e) {
        e.preventDefault();
        if (typeof addRound === 'function') addRound();
      }, {passive:false});
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initIOSScoreUI);
  } else {
    initIOSScoreUI();
  }
})();
</script>

</body>
</html>
